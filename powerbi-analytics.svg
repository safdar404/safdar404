<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Power BI and Decision Intelligence</title>
  <desc id="desc">Professional infographic showing Power BI workflow from data preparation through modeling, dashboards and decision intelligence.</desc>
  <defs>
