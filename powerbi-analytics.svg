    <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#f2c811"/><stop offset="1" stop-color="#ffd84d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
