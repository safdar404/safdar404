<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Muhammad Safdar — AI, GeoAI and data intelligence</title>
<desc id="desc">Animated multi-agent system: an orchestrator agent plans and routes tasks to retrieval, tool-calling, voice, GeoAI and human-review agents while data packets move between them.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10172e"/><stop offset="1" stop-color="#23143d"/></linearGradient>
<linearGradient id="rainbow"><stop stop-color="#22d3ee"/><stop offset=".35" stop-color="#818cf8"/><stop offset=".7" stop-color="#e879f9"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#818cf8" stop-opacity=".45"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
<clipPath id="mapclip"><rect x="-34" y="-24" width="68" height="48" rx="8"/></clipPath>
<!-- link paths: orchestrator (930,160) to each agent -->
<path id="pRag" d="M930 160 C880 120 840 95 795 82"/>
<path id="pTool" d="M930 160 C980 115 1030 92 1075 82"/>
<path id="pGeo" d="M930 160 C880 205 840 232 795 240"/>
<path id="pRev" d="M930 160 C980 205 1030 232 1075 240"/>
<path id="pVoice" d="M930 160 L1140 160"/>
</defs>

<rect width="1200" height="320" rx="24" fill="url(#bg)"/>
<rect x="0" y="306" width="1200" height="14" fill="url(#rainbow)"/>

<!-- faint grid / orbit rings -->
<g fill="none" stroke="#6674b8" opacity=".18">
<circle cx="930" cy="160" r="118"/><circle cx="930" cy="160" r="150" stroke-dasharray="3 7">
<animateTransform attributeName="transform" type="rotate" from="0 930 160" to="360 930 160" dur="60s" repeatCount="indefinite"/></circle>
</g>
<circle cx="930" cy="160" r="110" fill="url(#glow)"><animate attributeName="r" values="95;118;95" dur="4s" repeatCount="indefinite"/></circle>

<!-- links (flowing dashes) -->
<g fill="none" stroke="url(#rainbow)" stroke-width="2" stroke-dasharray="6 6" opacity=".7">
<use href="#pRag"/><use href="#pTool"/><use href="#pGeo"/><use href="#pRev"/><use href="#pVoice"/>
<animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
</g>

<!-- data packets: request out, result back -->
<g>
<circle r="5" fill="#67e8f9"><animateMotion dur="3s" repeatCount="indefinite" begin="0s"><mpath href="#pRag"/></animateMotion></circle>
<circle r="4" fill="#e879f9"><animateMotion dur="3s" repeatCount="indefinite" begin="1.5s" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#pRag"/></animateMotion></circle>
<circle r="5" fill="#fbbf24"><animateMotion dur="2.6s" repeatCount="indefinite" begin=".6s"><mpath href="#pTool"/></animateMotion></circle>
<circle r="4" fill="#67e8f9"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1.9s" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#pTool"/></animateMotion></circle>
<circle r="5" fill="#34d399"><animateMotion dur="3.4s" repeatCount="indefinite" begin="1.1s"><mpath href="#pGeo"/></animateMotion></circle>
<circle r="4" fill="#a5b4fc"><animateMotion dur="3.4s" repeatCount="indefinite" begin="2.8s" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#pGeo"/></animateMotion></circle>
<circle r="5" fill="#fb923c"><animateMotion dur="3.8s" repeatCount="indefinite" begin="2s"><mpath href="#pRev"/></animateMotion></circle>
<circle r="4" fill="#e879f9"><animateMotion dur="2.2s" repeatCount="indefinite" begin=".3s"><mpath href="#pVoice"/></animateMotion></circle>
</g>

<g font-family="Arial, Helvetica, sans-serif">

<!-- RAG / retrieval agent -->
<g transform="translate(790 80)">
<g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3.2s" repeatCount="indefinite"/>
<rect x="-36" y="-26" width="72" height="52" rx="12" fill="#17243f" stroke="#67e8f9" stroke-width="2"/>
<rect x="-18" y="-16" width="26" height="32" rx="3" fill="#0f1a33" stroke="#a5b4fc"/>
<g stroke="#a5b4fc" stroke-width="2"><path d="M-13 -8h16M-13 -1h16M-13 6h10"/></g>
<rect x="-14" y="-10" width="18" height="4" fill="#67e8f9" opacity=".7"><animate attributeName="y" values="-10;-3;4;-10" dur="1.8s" repeatCount="indefinite"/></rect>
<circle cx="18" cy="2" r="7" fill="none" stroke="#67e8f9" stroke-width="2.5"/><path d="M23 7l6 6" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
</g>
<text y="44" text-anchor="middle" fill="#b9c9e7" font-size="12">RAG · citations</text>
</g>

<!-- Tool-calling agent -->
<g transform="translate(1080 80)">
<g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.8s" begin=".5s" repeatCount="indefinite"/>
<rect x="-36" y="-26" width="72" height="52" rx="12" fill="#17243f" stroke="#fbbf24" stroke-width="2"/>
<g transform="translate(-13 0)"><g>
<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
<circle r="10" fill="none" stroke="#fbbf24" stroke-width="5" stroke-dasharray="5 3.4"/><circle r="5" fill="#17243f" stroke="#fbbf24" stroke-width="2"/></g></g>
<text x="17" y="5" text-anchor="middle" fill="#fde68a" font-size="13" font-family="Consolas, monospace" font-weight="700">{ }</text>
</g>
<text y="44" text-anchor="middle" fill="#b9c9e7" font-size="12">Tool calling</text>
</g>

<!-- GeoAI agent with orbiting satellite -->
<g transform="translate(790 240)">
<g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3.6s" begin="1s" repeatCount="indefinite"/>
<rect x="-36" y="-26" width="72" height="52" rx="12" fill="#17243f" stroke="#34d399" stroke-width="2"/>
<g clip-path="url(#mapclip)" transform="scale(.82)">
<rect x="-34" y="-24" width="68" height="48" fill="#0f2a2a"/>
<path d="M-34 -6Q-10 -14 6 -2T34 2V24H-34Z" fill="#14532d" opacity=".8"/>
<path d="M-34 10Q-6 2 10 12T34 8" fill="none" stroke="#38bdf8" stroke-width="3"/>
<g stroke="#34d399" stroke-opacity=".25"><path d="M-34 -12H34M-34 0H34M-34 12H34M-17 -24V24M0 -24V24M17 -24V24"/></g>
<path d="M-20 -18L-4 -20L2 -8L-14 -4Z" fill="#34d399" fill-opacity=".35" stroke="#6ee7b7"/>
<rect x="-34" y="-24" width="68" height="3" fill="#6ee7b7" opacity=".6"><animate attributeName="y" values="-24;24;-24" dur="3s" repeatCount="indefinite"/></rect>
</g>
<circle cx="10" cy="-4" r="3.5" fill="#fb7185"/><circle cx="10" cy="-4" r="3.5" fill="none" stroke="#fb7185"><animate attributeName="r" values="3.5;12" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/></circle>
</g>
<g><animateMotion dur="7s" repeatCount="indefinite" path="M0 -32 A50 32 0 1 1 0 32 A50 32 0 1 1 0 -32"/>
<rect x="-4" y="-3" width="8" height="6" rx="1" fill="#e2e8f0"/><rect x="-13" y="-2" width="7" height="4" fill="#38bdf8"/><rect x="6" y="-2" width="7" height="4" fill="#38bdf8"/>
</g>
<text y="44" text-anchor="middle" fill="#b9c9e7" font-size="12">GeoAI · Sentinel-2</text>
</g>

<!-- Human review agent -->
<g transform="translate(1080 240)">
<g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
<rect x="-36" y="-26" width="72" height="52" rx="12" fill="#17243f" stroke="#fb923c" stroke-width="2"/>
<circle cx="-10" cy="-5" r="7" fill="#fdba74"/><path d="M-22 15q12-14 24 0" fill="#fdba74"/>
<circle cx="15" cy="2" r="11" fill="#22c55e" opacity=".15"/>
<path d="M8 2l5 5 9-10" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="22" stroke-dashoffset="22">
<animate attributeName="stroke-dashoffset" values="22;0;0;22" keyTimes="0;.3;.85;1" dur="3.8s" begin="2s" repeatCount="indefinite"/></path>
</g>
<text y="44" text-anchor="middle" fill="#b9c9e7" font-size="12">Human review</text>
</g>

<!-- Voice agent -->
<g transform="translate(1150 160)">
<circle r="24" fill="#17243f" stroke="#e879f9" stroke-width="2"/>
<g fill="#f0abfc">
<rect x="-12" y="-4" width="4" height="8" rx="2"><animate attributeName="height" values="8;20;8" dur=".9s" repeatCount="indefinite"/><animate attributeName="y" values="-4;-10;-4" dur=".9s" repeatCount="indefinite"/></rect>
<rect x="-6" y="-8" width="4" height="16" rx="2"><animate attributeName="height" values="16;6;16" dur=".7s" repeatCount="indefinite"/><animate attributeName="y" values="-8;-3;-8" dur=".7s" repeatCount="indefinite"/></rect>
<rect x="0" y="-5" width="4" height="10" rx="2"><animate attributeName="height" values="10;22;10" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="-5;-11;-5" dur="1.1s" repeatCount="indefinite"/></rect>
<rect x="6" y="-3" width="4" height="6" rx="2"><animate attributeName="height" values="6;14;6" dur=".8s" repeatCount="indefinite"/><animate attributeName="y" values="-3;-7;-3" dur=".8s" repeatCount="indefinite"/></rect>
</g>
<text y="40" text-anchor="middle" fill="#b9c9e7" font-size="12">Voice</text>
</g>

<!-- Orchestrator robot -->
<g transform="translate(930 160)">
<g><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="2.4s" repeatCount="indefinite"/>
<path d="M0 -42V-54" stroke="#c4b5fd" stroke-width="3"/>
<circle cy="-57" r="5" fill="#e879f9"><animate attributeName="fill" values="#e879f9;#67e8f9;#fbbf24;#34d399;#e879f9" dur="4s" repeatCount="indefinite"/><animate attributeName="r" values="5;7;5" dur="1s" repeatCount="indefinite"/></circle>
<rect x="-50" y="-42" width="100" height="74" rx="22" fill="#17243f" stroke="#67e8f9" stroke-width="3"/>
<rect x="-38" y="-30" width="76" height="40" rx="14" fill="#0b1328"/>
<g><animateTransform attributeName="transform" type="translate" values="0 0;5 0;5 0;-5 0;-5 0;0 0" keyTimes="0;.15;.4;.55;.85;1" dur="5s" repeatCount="indefinite"/>
<ellipse cx="-16" cy="-12" rx="7" ry="7" fill="#67e8f9"><animate attributeName="ry" values="7;7;1;7;7" keyTimes="0;.45;.5;.55;1" dur="3.5s" repeatCount="indefinite"/></ellipse>
<ellipse cx="16" cy="-12" rx="7" ry="7" fill="#e879f9"><animate attributeName="ry" values="7;7;1;7;7" keyTimes="0;.45;.5;.55;1" dur="3.5s" repeatCount="indefinite"/></ellipse>
</g>
<path d="M-14 2Q0 10 14 2" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
<g fill="#0b1328" stroke="#818cf8"><rect x="-30" y="16" width="14" height="8" rx="2"/><rect x="-7" y="16" width="14" height="8" rx="2"/><rect x="16" y="16" width="14" height="8" rx="2"/></g>
<g fill="#34d399"><rect x="-28" y="18" width="10" height="4"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></rect><rect x="-5" y="18" width="10" height="4"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" repeatCount="indefinite"/></rect><rect x="18" y="18" width="10" height="4"><animate attributeName="opacity" values="1;.2;1" dur=".8s" repeatCount="indefinite"/></rect></g>
</g>
<text y="56" text-anchor="middle" fill="#e9d5ff" font-size="12" font-weight="700" letter-spacing="1">ORCHESTRATOR</text>
</g>

<!-- live agent status ticker -->
<g transform="translate(930 290)" font-size="12" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">
<text fill="#67e8f9" opacity="0">▸ plan task<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.18;.2;1" dur="10s" repeatCount="indefinite"/></text>
<text fill="#a5b4fc" opacity="0">▸ retrieve evidence<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.2;.21;.38;.4;1" dur="10s" repeatCount="indefinite"/></text>
<text fill="#fde68a" opacity="0">▸ call tools<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.4;.41;.58;.6;1" dur="10s" repeatCount="indefinite"/></text>
<text fill="#6ee7b7" opacity="0">▸ analyse spatial data<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.6;.61;.78;.8;1" dur="10s" repeatCount="indefinite"/></text>
<text fill="#4ade80" opacity="0">▸ human approved ✓<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.8;.81;.98;1" dur="10s" repeatCount="indefinite"/></text>
</g>

<!-- left text (unchanged) -->
<text x="52" y="56" fill="#67e8f9" font-size="15" letter-spacing="3">PYTHON • INTELLIGENCE • USEFUL TOOLS</text>
<text x="50" y="119" fill="#ffffff" font-size="48" font-weight="700">Muhammad Safdar</text>
<text x="52" y="166" fill="#e9d5ff" font-size="26">Generative AI &amp; Agentic Applications</text>
<text x="52" y="203" fill="#b9c9e7" font-size="21">GeoAI · Enterprise GIS · Data Science · Engineering</text>
<rect x="52" y="228" width="575" height="34" rx="17" fill="#1d2a4a" stroke="#4c5f92" stroke-opacity=".6"/>
<text x="72" y="250" fill="#e2e8f0" font-size="14">Explore projects by role, workflow and real implementation</text>
</g>
</svg>
