<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc"><title id="title">GeoAI delivery workflow</title><desc id="desc">A professional workflow infographic from problem definition through data, validation, GeoAI analysis, decision support and deployment.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10283a"/></linearGradient><linearGradient id="c" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#20d8ff"/><stop offset="1" stop-color="#8cecff"/></linearGradient></defs><rect width="1200" height="260" rx="24" fill="url(#bg)"/><text x="48" y="42" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#20d8ff" letter-spacing="2">APPLIED GEOAI DELIVERY PIPELINE</text><g font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><g transform="translate(35 82)"><rect width="155" height="105" rx="16" fill="#0b1b2b" stroke="#20d8ff" stroke-opacity=".45"/><text x="77" y="42" fill="#eafcff" font-weight="700">01 · PROBLEM</text><text x="77" y="66" fill="#9dbcca">decision question</text><text x="77" y="84" fill="#9dbcca">success criteria</text></g><g transform="translate(220 82)"><rect width="155" height="105" rx="16" fill="#0b1b2b" stroke="#20d8ff" stroke-opacity=".45"/><text x="77" y="42" fill="#eafcff" font-weight="700">02 · DATA</text><text x="77" y="66" fill="#9dbcca">EO · GIS · IoT</text><text x="77" y="84" fill="#9dbcca">ETL · APIs</text></g><g transform="translate(405 82)"><rect width="155" height="105" rx="16" fill="#0b1b2b" stroke="#9be84f" stroke-opacity=".45"/><text x="77" y="42" fill="#eafcff" font-weight="700">03 · QA</text><text x="77" y="66" fill="#9dbcca">CRS · topology</text><text x="77" y="84" fill="#9dbcca">provenance</text></g><g transform="translate(590 82)"><rect width="155" height="105" rx="16" fill="#0b1b2b" stroke="#f0c65c" stroke-opacity=".45"/><text x="77" y="42" fill="#eafcff" font-weight="700">04 · GEOAI</text><text x="77" y="66" fill="#9dbcca">ML · CV · MCDA</text><text x="77" y="84" fill="#9dbcca">spatial modeling</text></g><g transform="translate(775 82)"><rect width="155" height="105" rx="16" fill="#0b1b2b" stroke="#a879ff" stroke-opacity=".45"/><text x="77" y="42" fill="#eafcff" font-weight="700">05 · DECIDE</text><text x="77" y="66" fill="#9dbcca">maps · scores</text><text x="77" y="84" fill="#9dbcca">risk · ranking</text></g><g transform="translate(960 82)"><rect width="205" height="105" rx="16" fill="#0b1b2b" stroke="#20d8ff" stroke-opacity=".45"/><text x="102" y="42" fill="#eafcff" font-weight="700">06 · DELIVER</text><text x="102" y="66" fill="#9dbcca">APIs · dashboards</text><text x="102" y="84" fill="#9dbcca">reports · deployment</text></g><g fill="url(#c)"><path d="M192 132h22l-8-7 4-4 16 15-16 15-4-4 8-7h-22z"/><path d="M377 132h22l-8-7 4-4 16 15-16 15-4-4 8-7h-22z"/><path d="M562 132h22l-8-7 4-4 16 15-16 15-4-4 8-7h-22z"/><path d="M747 132h22l-8-7 4-4 16 15-16 15-4-4 8-7h-22z"/><path d="M932 132h22l-8-7 4-4 16 15-16 15-4-4 8-7h-22z"/></g></g><text x="48" y="225" font-family="Arial,sans-serif" font-size="13" fill="#9dbcca">Human validation · uncertainty · sensitivity analysis · authoritative local data remain essential for operational decisions.</text></svg>